name: Выпуск
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.18"
      - name: Тег совпадает с версией
        run: |
          version="$(uv version --short)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Тег ${GITHUB_REF_NAME} не совпадает с версией ${version} в pyproject.toml" >&2
            exit 1
          fi
      - run: uv run --locked --group dev --group train pytest
      - name: Хуки prek на всех файлах
        run: uv run --locked --group dev --group train prek run --all-files --show-diff-on-failure
      - name: Пакет для PyPI
        run: uv build --out-dir dist/pypi
      - name: Архив скиллов
        run: |
          mkdir -p dist/assets
          zip -r "dist/assets/avoid-ai-writing-russian-${GITHUB_REF_NAME}.zip" \
            skills src examples pyproject.toml uv.lock README.md LICENSE NOTICE.md CHANGELOG.md
      - name: Контрольные суммы
        run: |
          cp dist/pypi/* dist/assets/
          cd dist/assets && sha256sum * > SHA256SUMS
      - name: Заметки к выпуску
        run: uv run python scripts/release_notes.py "${GITHUB_REF_NAME}" > dist/NOTES.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
  pypi:
    # Доверенная публикация: PyPI принимает токен OIDC от этого workflow,
    # паролей и API-токенов в секретах нет.
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/aiw-ru/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/pypi/
  github:
    needs: [build, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Публикация
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # v2.0.0rc1 и подобные (PEP 440: aN, bN, rcN) выходят как pre-release.
          flags=()
          if [[ "${GITHUB_REF_NAME}" =~ (a|b|rc)[0-9]+$ ]]; then flags+=(--prerelease); fi
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file dist/NOTES.md \
            "${flags[@]}" \
            dist/assets/*
