name: Выпуск
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
      - name: Тег совпадает с версией
        run: |
          version="$(uv version --short)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Тег ${GITHUB_REF_NAME} не совпадает с версией ${version} в pyproject.toml" >&2
            exit 1
          fi
      - run: uv run --locked --group dev --group train pytest
      - name: Хуки prek на всех файлах
        run: uv run --locked --group dev --group train prek run --all-files --show-diff-on-failure
      - name: Пакет для PyPI
        run: uv build --out-dir dist/pypi
      - name: Архив скиллов
        run: |
          mkdir -p dist/assets
          zip -r "dist/assets/avoid-ai-writing-russian-${GITHUB_REF_NAME}.zip" \
            skills src examples pyproject.toml uv.lock README.md LICENSE NOTICE.md CHANGELOG.md
      - name: Контрольные суммы
        run: |
          cp dist/pypi/* dist/assets/
          cd dist/assets && sha256sum * > SHA256SUMS
      - name: Заметки к выпуску
        run: uv run python scripts/release_notes.py "${GITHUB_REF_NAME}" > dist/NOTES.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
  pypi:
    # Доверенная публикация: PyPI принимает токен OIDC от этого workflow,
    # паролей и API-токенов в секретах нет.
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/aiw-ru/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/pypi/
  github:
    needs: [build, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Публикация
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # v2.0.0rc1 и подобные (PEP 440: aN, bN, rcN) выходят как pre-release.
          flags=()
          if [[ "${GITHUB_REF_NAME}" =~ (a|b|rc)[0-9]+$ ]]; then flags+=(--prerelease); fi
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file dist/NOTES.md \
            "${flags[@]}" \
            dist/assets/*
