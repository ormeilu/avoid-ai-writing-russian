name: Трансформер на CPU
# Тесты обучения и экспорта трансформера тянут torch и transformers (группа transformer), поэтому идут
# отдельно от основного CI: по расписанию, вручную и при правке связанных файлов.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  pull_request:
    paths:
      - scripts/train_transformer.py
      - scripts/colab_transformer.py
      - scripts/fast_modernbert.py
      - scripts/runtime_bench.py
      - scripts/llmtrace.py
      - tests/test_transformer.py
      - tests/test_model_language.py
      - tests/fixtures/tiny-transformer/**
      - src/aiw_ru/models.py
      - pyproject.toml
      - uv.lock
      - .github/workflows/transformer.yml
permissions:
  contents: read
jobs:
  transformer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.18"
          python-version: "3.12"
      - name: Тесты трансформера и языкового допуска моделей
        run: uv run --locked --group dev --group train --group transformer pytest tests/test_transformer.py tests/test_model_language.py
      - name: Типы с установленной группой transformer
        run: uv run --locked --group dev --group train --group transformer ty check
