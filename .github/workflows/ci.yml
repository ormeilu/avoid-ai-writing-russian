name: CI
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.18"
          python-version: ${{ matrix.python }}
      - name: libomp для LightGBM на macOS
        if: runner.os == 'macOS'
        run: brew install libomp
      - run: uv run --locked --group dev --group train pytest
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.18"
      - name: Хуки prek на всех файлах
        run: uv run --locked --group dev --group train prek run --all-files --show-diff-on-failure
      - name: Сборка пакета
        run: uv build
      - name: Собранный пакет ставится и запускается
        run: |
          uvx --from "$(ls dist/*.whl)" aiw-ru --help
          uvx --from "$(ls dist/*.whl)" aiw-ru skill antiplagiat > /dev/null
