[project]
name = "aiw-ru"
version = "2.1.0"
description = "Приметы ИИ-стиля в русском тексте: канцелярит, кальки, шаблонная структура; оценка по фрагментам в духе «Антиплагиата»"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{ name = "Ilya Lubenets", email = "lubenets.ilya.igorevich@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.5",
    "regex>=2026.9.10",
    "rich>=15.0.0",
]
keywords = ["russian", "ai-detection", "ai-writing", "antiplagiat", "канцелярит", "editing", "style", "claude-code"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Natural Language :: Russian",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]

[project.optional-dependencies]
# Необязательные модели (aiw-ru models install): трансформер в ONNX и LightGBM; без них всё остальное работает.
# У onnxruntime нет колёс для macOS на Intel: там ставится только LightGBM.
ml = [
    "huggingface-hub>=1.33.0",
    "lightgbm>=4.7.0",
    "numpy>=2.5.3",
    "onnxruntime>=1.30.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "tokenizers>=0.23.2",
]

[project.urls]
Homepage = "https://github.com/ormeilu/avoid-ai-writing-russian"
Repository = "https://github.com/ormeilu/avoid-ai-writing-russian"
Changelog = "https://github.com/ormeilu/avoid-ai-writing-russian/blob/master/CHANGELOG.md"
Issues = "https://github.com/ormeilu/avoid-ai-writing-russian/issues"

[project.scripts]
aiw-ru = "aiw_ru.cli:run"

[build-system]
# hatchling, а не uv_build: скиллы из skills/ должны попасть в пакет (aiw-ru skill),
# а uv_build кладёт в wheel только сам модуль.
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiw_ru"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "aiw_ru/data/skills"

[tool.hatch.build.targets.sdist]
include = ["/src/aiw_ru", "/skills", "/README.md", "/LICENSE", "/NOTICE.md", "/CHANGELOG.md"]

[dependency-groups]
dev = [
    "prek>=0.5.3",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "ty>=0.0.84",
    "types-regex>=2026.9.10.20260911",
]
# Обучение LightGBM и всё, что нужно тестам моделей: пакеты extra ml и scikit-learn.
train = [
    "huggingface-hub>=1.33.0",
    "lightgbm>=4.7.0",
    "numpy>=2.5.3",
    "onnxruntime>=1.30.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "scikit-learn>=1.9.1",
    "tokenizers>=0.23.2",
]
# Дообучение трансформера: тяжёлые пакеты отдельно, чтобы CI и LightGBM их не тянули.
transformer = [
    "onnx>=1.23.0",
    "onnxruntime>=1.30.0",
    "onnxscript>=0.7.2",
    "tokenizers>=0.23.2",
    "torch>=2.14.0",
    "transformers>=5.17.0",
]

[tool.uv]
required-version = ">=0.12.18"
# По умолчанию группы не ставятся: скилл зовёт `uv run --project ../.. aiw-ru` и получает
# только сам детектор. Разработка: `uv sync --group dev --group train` (dev — инструменты, train — обучение).
default-groups = []

[tool.ruff]
line-length = 120
src = ["src", "scripts"]

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "TID"]
# Списки слов читаются лучше строкой через пробел.
ignore = ["SIM905"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ty.environment]
# Тесты импортируют скрипты как модули верхнего уровня, как pytest с pythonpath ниже.
extra-paths = ["scripts", "evals"]

# torch, transformers и onnx стоят только в группе transformer, которую CI не ставит.
# Без неё ty не находит эти модули; с ней (uv run --group transformer ty check) проверяет полностью.
[[tool.ty.overrides]]
include = [
    "scripts/train_transformer.py",
    "scripts/colab_transformer.py",
    "scripts/fast_modernbert.py",
    "scripts/runtime_bench.py",
    "tests/test_transformer.py",
    "tests/fixtures/tiny-transformer/make.py",
]

[tool.ty.overrides.rules]
unresolved-import = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Скрипты выпуска и оценки — не пакет, тесты импортируют их как модули верхнего уровня.
pythonpath = ["scripts", "evals"]
addopts = ["-p", "no:cacheprovider"]
