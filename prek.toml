# Конфигурация prek (https://prek.j178.dev) — быстрой замены pre-commit на Rust.
#:schema https://www.schemastore.org/prek.json
#
# Установка хуков один раз после клонирования:
#   prek install --hook-type pre-commit --hook-type commit-msg --hook-type pre-push
#
# Порядок задан приоритетами: сначала дешёвые проверки файлов и секретов
# (0–10), потом линтер (20) и форматирование (21), потом типы и проектные
# проверки (30), тесты — только перед отправкой (pre-push).

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  { id = "check-added-large-files", args = ["--maxkb=512"], priority = 0, fail_fast = true },
  { id = "detect-private-key", priority = 0, fail_fast = true },
  { id = "check-merge-conflict", priority = 0 },
  { id = "check-case-conflict", priority = 0 },
  { id = "check-yaml", priority = 10 },
  { id = "check-toml", priority = 10 },
  { id = "check-json", priority = 10 },
  { id = "end-of-file-fixer", priority = 10 },
  # В Markdown два пробела в конце строки — перенос; их не трогаем.
  { id = "trailing-whitespace", args = ["--markdown-linebreak-ext=md"], priority = 10 },
  { id = "mixed-line-ending", args = ["--fix=lf"], priority = 10 },
]

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"
hooks = [
  { id = "gitleaks", priority = 0, fail_fast = true },
]

[[repos]]
repo = "https://github.com/google/yamlfmt"
rev = "v0.21.0"
hooks = [
  { id = "yamlfmt", priority = 10 },
]

# Проектные хуки: скрипты на Python через uv и сам детектор.
[[repos]]
repo = "local"
hooks = [
  {
    id = "invisible-chars",
    name = "нет невидимых символов и латиницы внутри русских слов",
    entry = "uv run python scripts/check_invisible.py",
    language = "system",
    types_or = ["python", "ts", "markdown", "json", "yaml"],
    # Запись terminalizer хранит ANSI-коды вида \u001b[1mтекст: это не подмена букв.
    exclude = '^docs/demo/aiw-demo\.yml$',
    priority = 5,
  },
  {
    id = "ruff-check",
    name = "Ruff: линтер",
    entry = "uv run --group dev ruff check --fix",
    language = "system",
    types = ["python"],
    priority = 20,
  },
  # Формат после линтера: оба переписывают файлы, в одном приоритете они шли бы параллельно.
  {
    id = "ruff-format",
    name = "Ruff: формат",
    entry = "uv run --group dev ruff format",
    language = "system",
    types = ["python"],
    priority = 21,
  },
  {
    id = "typecheck",
    name = "ty: проверка типов",
    entry = "uv run --group dev --group train ty check",
    language = "system",
    types = ["python"],
    pass_filenames = false,
    priority = 30,
  },
  {
    id = "versions",
    name = "версия одинакова во всех файлах",
    entry = "uv run python scripts/check_versions.py",
    language = "system",
    files = '^(pyproject\.toml|uv\.lock|CITATION\.cff|\.claude-plugin/(plugin|marketplace)\.json|\.codex-plugin/plugin\.json|skills/.+/SKILL\.md)$',
    pass_filenames = false,
    priority = 30,
  },
  {
    id = "selfscan",
    name = "документация проходит собственный детектор",
    entry = "uv run aiw-ru scan --context docs --min P1 --fail-above 30",
    language = "system",
    files = '^(README|CONTRIBUTING|AGENTS|CLAUDE|NOTICE|CHANGELOG)\.md$|^skills/.+\.md$',
    priority = 30,
  },
  {
    id = "commit-msg",
    name = "сообщение коммита на русском",
    entry = "uv run python scripts/check_commit_msg.py",
    language = "system",
    stages = ["commit-msg"],
  },
  {
    id = "tests",
    name = "pytest",
    entry = "uv run --group dev --group train pytest",
    language = "system",
    pass_filenames = false,
    always_run = true,
    stages = ["pre-push"],
  },
]
