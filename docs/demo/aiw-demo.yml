    cursor: "#c5c8cf"
    black: "#0f1015"
    red: "#f0826a"
    green: "#8fcf6a"
    yellow: "#f2c265"
    blue: "#6aa7e0"
    magenta: "#c49be8"
    cyan: "#62b8d4"
    white: "#d5d8de"
    brightBlack: "#6b707a"
    brightRed: "#f0826a"
    brightGreen: "#8fcf6a"
